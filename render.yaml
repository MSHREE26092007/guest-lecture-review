services:
  - type: web
    name: guest-lecture-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
  - type: web
    name: guest-lecture-ui
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/ui/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: API_BASE_URL
        value: https://guest-lecture-api.onrender.com
        # Replace with your actual API URL after first deploy
      - key: PYTHON_VERSION
        value: 3.12.0
